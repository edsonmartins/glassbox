<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="boxClaude" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#c4956a"/>
    </linearGradient>
    <linearGradient id="boxMcp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>
    <linearGradient id="boxJvm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97583"/>
      <stop offset="100%" stop-color="#f85149"/>
    </linearGradient>
    <linearGradient id="boxTui" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#56d364"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrowRight" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b949e"/>
    </marker>
    <marker id="arrowLeft" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#8b949e"/>
    </marker>
    <marker id="arrowDown" markerWidth="7" markerHeight="10" refX="3.5" refY="9" orient="auto">
      <polygon points="0 0, 3.5 10, 7 0" fill="#8b949e"/>
    </marker>
    <marker id="arrowUp" markerWidth="7" markerHeight="10" refX="3.5" refY="1" orient="auto">
      <polygon points="0 10, 3.5 0, 7 10" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="380" rx="12" fill="url(#bg)"/>
  <rect width="820" height="380" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text x="410" y="36" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600" letter-spacing="0.5">Arquitetura GlassBox</text>

  <!-- ===== ROW 1: Claude / MCP Server / JVM ===== -->

  <!-- Claude Box -->
  <g filter="url(#shadow)">
    <rect x="40" y="70" width="180" height="90" rx="10" fill="#1c1c1c" stroke="url(#boxClaude)" stroke-width="2"/>
  </g>
  <rect x="40" y="70" width="180" height="28" rx="10" fill="url(#boxClaude)" opacity="0.15"/>
  <text x="130" y="90" text-anchor="middle" fill="#d4a574" font-size="12" font-weight="600">Claude / AI Client</text>
  <text x="130" y="116" text-anchor="middle" fill="#8b949e" font-size="11">Envia prompts</text>
  <text x="130" y="133" text-anchor="middle" fill="#8b949e" font-size="11">Chama MCP tools</text>

  <!-- MCP Server Box -->
  <g filter="url(#shadow)">
    <rect x="320" y="70" width="200" height="90" rx="10" fill="#1c1c1c" stroke="url(#boxMcp)" stroke-width="2"/>
  </g>
  <rect x="320" y="70" width="200" height="28" rx="10" fill="url(#boxMcp)" opacity="0.15"/>
  <text x="420" y="90" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="600">GlassBox MCP Server</text>
  <text x="420" y="116" text-anchor="middle" fill="#8b949e" font-size="11">TypeScript</text>
  <text x="420" y="133" text-anchor="middle" fill="#8b949e" font-size="11">17 debug tools</text>

  <!-- JVM Box -->
  <g filter="url(#shadow)">
    <rect x="620" y="70" width="160" height="90" rx="10" fill="#1c1c1c" stroke="url(#boxJvm)" stroke-width="2"/>
  </g>
  <rect x="620" y="70" width="160" height="28" rx="10" fill="url(#boxJvm)" opacity="0.15"/>
  <text x="700" y="90" text-anchor="middle" fill="#f97583" font-size="12" font-weight="600">JVM (Java)</text>
  <text x="700" y="116" text-anchor="middle" fill="#8b949e" font-size="11">Aplicacao alvo</text>
  <text x="700" y="133" text-anchor="middle" fill="#8b949e" font-size="11">JDWP habilitado</text>

  <!-- Arrow: Claude <-> MCP Server -->
  <line x1="220" y1="108" x2="318" y2="108" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowRight)"/>
  <line x1="318" y1="122" x2="220" y2="122" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowLeft)"/>
  <rect x="235" y="97" width="70" height="18" rx="4" fill="#0d1117"/>
  <text x="270" y="110" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="500">MCP stdio</text>
  <text x="270" y="134" text-anchor="middle" fill="#484f58" font-size="9">JSON-RPC</text>

  <!-- Arrow: MCP Server <-> JVM -->
  <line x1="520" y1="108" x2="618" y2="108" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowRight)"/>
  <line x1="618" y1="122" x2="520" y2="122" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowLeft)"/>
  <rect x="543" y="97" width="52" height="18" rx="4" fill="#0d1117"/>
  <text x="569" y="110" text-anchor="middle" fill="#f97583" font-size="10" font-weight="500">JDWP</text>
  <text x="569" y="134" text-anchor="middle" fill="#484f58" font-size="9">JDB</text>

  <!-- ===== Vertical connection: MCP Server -> TUI ===== -->
  <line x1="420" y1="160" x2="420" y2="248" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowDown)"/>
  <line x1="410" y1="248" x2="410" y2="160" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowUp)"/>

  <!-- Protocol label on vertical connection -->
  <rect x="430" y="185" width="115" height="36" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="487" y="201" text-anchor="middle" fill="#56d364" font-size="10" font-weight="500">Unix Socket</text>
  <text x="487" y="215" text-anchor="middle" fill="#484f58" font-size="9">JSONL bidirecional</text>

  <!-- ===== ROW 2: TUI ===== -->

  <!-- TUI Box (wider, more detail) -->
  <g filter="url(#shadow)">
    <rect x="270" y="250" width="300" height="100" rx="10" fill="#1c1c1c" stroke="url(#boxTui)" stroke-width="2"/>
  </g>
  <rect x="270" y="250" width="300" height="28" rx="10" fill="url(#boxTui)" opacity="0.15"/>
  <text x="420" y="270" text-anchor="middle" fill="#56d364" font-size="12" font-weight="600">GlassBox TUI</text>

  <!-- TUI panels inside -->
  <rect x="284" y="290" width="64" height="22" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="316" y="305" text-anchor="middle" fill="#c9d1d9" font-size="9">Source</text>

  <rect x="356" y="290" width="64" height="22" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="388" y="305" text-anchor="middle" fill="#c9d1d9" font-size="9">Variables</text>

  <rect x="428" y="290" width="64" height="22" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="460" y="305" text-anchor="middle" fill="#c9d1d9" font-size="9">Agent Log</text>

  <rect x="500" y="290" width="58" height="22" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="529" y="305" text-anchor="middle" fill="#c9d1d9" font-size="9">Side Info</text>

  <text x="420" y="338" text-anchor="middle" fill="#484f58" font-size="10">Rust / Ratatui</text>

  <!-- ===== Legend ===== -->
  <text x="410" y="370" text-anchor="middle" fill="#484f58" font-size="10">A IA controla o debugger — o desenvolvedor observa em tempo real</text>
</svg>
